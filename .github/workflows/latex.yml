name: LaTeX documentation build
on:
  pull_request:
    paths: ['main.tex', 'config/**', 'chapters/**', 'appendices/**', 'tables/**',
            'figures/**', 'bibliography/**', 'sysml/**', 'tools/generate_docs.py',
            '.github/workflows/latex.yml']
  push:
    branches: [main]
    paths: ['main.tex', 'config/**', 'chapters/**', 'appendices/**', 'tables/**',
            'figures/**', 'bibliography/**', 'sysml/**', 'tools/generate_docs.py',
            '.github/workflows/latex.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Generated tables match the model
        run: python3 tools/generate_docs.py --check
      - name: Build PDF
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
      - uses: actions/upload-artifact@v4
        with:
          name: dokumentation-pdf
          path: main.pdf
